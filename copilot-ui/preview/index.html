<!doctype html><html lang="en" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Copilot UI reference</title><link rel="stylesheet" href="../theme/tokens.css"><link rel="stylesheet" href="../theme/components.css"><style>
.shell{max-width:1440px;margin:auto;padding:26px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:28px}.brand{font-size:19px;font-weight:750}.brand b{color:var(--accent)}nav{display:flex;gap:16px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none}nav a.active{color:var(--accent);font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.question{background:var(--raised);padding:16px;border-radius:10px}.answer{padding:26px;border:1px solid var(--border);border-radius:12px}.subtle{border-top:1px solid var(--border);padding-top:18px}.wide{width:100%}.phone{max-width:540px;margin:24px auto}.phone .opener{font-size:34px}.phone .detail{font-size:19px}.phone .panel{min-height:620px}.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--raised);margin-right:10px}.status{color:var(--success)}.pending{color:var(--warning)}.disabled{color:var(--danger)}.footer{margin-top:28px;color:var(--muted);font-size:12px}.tabs{border-bottom:1px solid var(--border);padding-bottom:14px}.tabs b{color:var(--accent)}@media(max-width:760px){.shell{padding:18px}.layout,.formgrid{grid-template-columns:1fr}header{align-items:flex-start;flex-wrap:wrap}nav{gap:10px}.panel{padding:18px}.phone{margin:12px auto}.phone .opener{font-size:30px}table{min-width:650px}.tablewrap{overflow:auto}}
</style><body><div class="shell"><header><div class="brand">Interview <b>Copilot</b></div><nav id="nav"></nav><button id="theme">Switch theme</button></header><main id="main"></main><div class="footer">Design reference · fictional sample data · for rehearsal or expressly permitted interview assistance</div></div><script>
const params=new URLSearchParams(location.search);let theme=params.get('theme')||'dark';document.documentElement.dataset.theme=theme;document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme};const page=params.get('page')||'manager';const pages={manager:'Live room',candidate:'Candidate',users:'Users',resume:'Résumés',setup:'Interviews',account:'Account'};document.getElementById('nav').innerHTML=Object.entries(pages).map(([k,v])=>`<a class="${k===page?'active':''}" href="?page=${k}&theme=${theme}">${v}</a>`).join('');const opener='I start by aligning the team around a measurable customer outcome.';const detail='In my last onboarding project, I worked with design and engineering to identify friction in the activation flow. We agreed on a success metric, tested a smaller release, and reviewed the results together. That helped us make a more informed decision about the next iteration.';const answer=`<span class="tag">Prepared answer</span><div class="opener">${opener}</div><p class="detail">${detail} <span class="caret"></span></p>`;const heading=(a,b)=>`<h1>${a}</h1><p class="muted">${b}</p>`;const field=(a,b)=>`<label>${a}<input value="${b}"></label>`;const select=(a,b)=>`<label>${a}<select><option>${b}</option></select></label>`;const views={manager:()=>`${heading('Interview room','Acme Studio · Product Manager · Rehearsal session')}<div class="layout"><section class="panel stack"><div class="sectionhead"><div class="row"><span class="tag">In session</span><span class="muted">v2 · 1 watching</span></div><button>End session</button></div><div class="question"><small class="muted">Question · 10:24</small><h3>How do you lead cross-functional projects?</h3></div><article class="answer">${answer}<div class="row subtle" style="margin-top:24px"><button>Shorter</button><button>More detail</button><button>Example</button><button>STAR</button><button>Stop</button></div></article><div class="muted">Rehearsal follow-ups</div><div class="row"><button>How did you measure success?</button><button>What would you change?</button></div><div class="row"><input style="flex:1" placeholder="Enter a practice question…"><button class="primary">Send</button></div></section><aside class="panel stack"><div class="row tabs"><b>Résumé</b><span>Prep pack</span><span>Summary</span></div><h2>Alex Chen</h2><p class="muted">Product manager · 6 years</p><div class="subtle"><h3>Recent experience</h3><p>Product Manager · Nova Studio</p><p class="muted">Onboarding redesign, product analytics, cross-functional delivery.</p></div><div class="subtle"><h3>Coach note</h3><textarea class="wide" placeholder="Write feedback…"></textarea><button>Save note</button></div></aside></div>`,candidate:()=>`<div class="phone">${heading('Practice reader','Product Manager · Shared rehearsal')}<section class="panel stack" style="margin-top:20px"><div class="sectionhead"><span class="tag">Connected</span><span class="muted">Read-only</span></div>${answer}<div class="subtle row"><button>A−</button><button>A+</button><span class="muted">Follow latest</span></div></section></div>`,users:()=>`${heading('Users','Manage access and candidate assignments.')}<section class="panel stack" style="margin-top:24px"><div class="sectionhead"><div class="row"><h2>Roster</h2><span class="pending">1 pending</span></div><button class="primary">Add user</button></div><div class="row"><input placeholder="Search name or email"><button>All roles</button><button>All statuses</button></div><div class="tablewrap"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Assigned manager</th><th>Actions</th></tr></thead><tbody>${[['AC','Alex Chen','Candidate','Pending','Jane Miller'],['JM','Jane Miller','Manager','Approved','—'],['RK','Ryan Kim','Admin','Approved','—'],['LS','Lisa Sun','Candidate','Disabled','Jane Miller']].map(([i,n,r,s,m])=>`<tr><td><span class="avatar">${i}</span>${n}<div class="muted">${n.toLowerCase().replace(' ','.')}@example.com</div></td><td>${r}</td><td class="${s==='Pending'?'pending':s==='Disabled'?'disabled':'status'}">${s}</td><td>${m}</td><td><button>${s==='Pending'?'Approve':s==='Disabled'?'Enable':'Manage'}</button></td></tr>`).join('')}</tbody></table></div></section>`,resume:()=>`${heading('Résumé editor','Review imported text and prepare verified answers.')}<div class="layout"><section class="panel stack"><div class="row tabs"><b>Résumé text</b><span>Basic Information Q&A</span></div><div class="row"><button>Import PDF</button><button>Insert template</button><button class="primary">Save</button></div><textarea style="font-family:var(--mono);min-height:420px;line-height:1.8">ALEX CHEN\n\nSUMMARY\nProduct manager with six years of experience.\n\nEXPERIENCE\nProduct Manager | Nova Studio\n2021 – Present\n- Led onboarding redesign.\n- Partnered with engineering and design.\n\nSKILLS\nProduct strategy, analytics, experimentation</textarea><p class="muted">Review before saving. Store text only.</p></section><aside class="panel stack"><h2>Prepared Q&A</h2><button class="primary">Draft from résumé</button>${['Tell me about yourself','Salary expectations','Notice period'].map(q=>`<div class="question"><h3>${q}</h3><p class="muted">Review and edit your answer.</p><button>Edit</button></div>`).join('')}<button>Add question</button></aside></div>`,setup:()=>`${heading('Interview setup','Create or edit a rehearsal or authorized session.')}<section class="panel stack" style="margin-top:24px"><div class="sectionhead"><h2>Session details</h2><span class="muted">v1 → v2</span></div><div class="formgrid">${field('Job title','Product Manager')}${field('Company','Acme Studio')}${field('Interviewers','Hiring team')}${select('Type','Intro')}${select('Résumé','Alex Chen')}${select('Model','Configured Claude model')}${select('Answer language','English')}${select('Assigned candidates','Alex Chen')}<label>Company notes<textarea rows="5">Product-led SaaS team.</textarea></label><label>System prompt<textarea rows="5">Ground practice answers in verified experience. Flag missing facts.</textarea></label></div><p class="muted">Model speed varies. Verify latency with real measurements.</p><div class="row"><span class="tag">Scheduled</span><button>Start session</button><button>New version</button><button class="primary">Save setup</button></div></section>`,account:()=>`${heading('Account','Manage profile, password and credentials.')}<section class="panel stack" style="margin-top:24px;max-width:760px"><h2>Profile</h2>${field('Name','Jane Miller')}${field('Email','jane@example.com')}<button>Change password</button><div class="subtle stack"><h2>Personal API key</h2><div class="row"><span class="tag">Key set · •••• 4A1F</span><button>Replace</button><button>Remove</button></div><p class="muted">Credentials must stay on the server. Never expose the full key in the browser.</p></div><button class="primary">Save profile</button></section>`};document.getElementById('main').innerHTML=(views[page]||views.manager)();
</script></body></html>
