# interview-assistant.candidatesbridge.com 301s to
# https://www.interview-assistant.candidatesbridge.com.
#
# www proxies:
#   /api/ -> backend  (127.0.0.1:9011, PM2 interview-api)   [SSE streaming]
#   /     -> frontend (127.0.0.1:9012, PM2 interview-web / vite preview)
#
# Install:
#   sudo cp docs/nginx/interview-assistant.candidatesbridge.com.conf \
#           /etc/nginx/sites-available/interview-assistant.candidatesbridge.com
#   sudo ln -sfn /etc/nginx/sites-available/interview-assistant.candidatesbridge.com \
#                /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (first time) — the :80 block below must already be live so the ACME
# challenge can be served, and DNS for BOTH names must point at this host:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d interview-assistant.candidatesbridge.com \
#     -d www.interview-assistant.candidatesbridge.com

upstream interview_web {
    server 127.0.0.1:9012;
    keepalive 32;
}

upstream interview_api {
    server 127.0.0.1:9011;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: serve ACME challenge, otherwise 301 to https www
server {
    listen 80;
    listen [::]:80;
    server_name interview-assistant.candidatesbridge.com www.interview-assistant.candidatesbridge.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.interview-assistant.candidatesbridge.com$request_uri;
    }
}

# HTTPS apex subdomain: 301 to https www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name interview-assistant.candidatesbridge.com;

    ssl_certificate     /etc/letsencrypt/live/interview-assistant.candidatesbridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interview-assistant.candidatesbridge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.interview-assistant.candidatesbridge.com$request_uri;
}

# HTTPS www: the app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.interview-assistant.candidatesbridge.com;

    ssl_certificate     /etc/letsencrypt/live/interview-assistant.candidatesbridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interview-assistant.candidatesbridge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    # Backend API, including the Server-Sent Events chat stream.
    location /api/ {
        proxy_pass http://interview_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't buffer — stream tokens straight through.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Frontend (static build served by vite preview).
    location / {
        proxy_pass http://interview_web;
        proxy_http_version 1.1;

        # vite preview rejects unknown Host headers; "localhost" is always
        # allowed, and a static SPA doesn't care about the upstream Host.
        proxy_set_header Host              localhost;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
